format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

workflows:
  test_pem_format_key:
    description: Activate a freshly generated RSA key in PEM format.
    envs:
    - KEYGEN_ARGS: -t rsa -b 2048 -m PEM
    after_run:
    - _generate_key
    - _run
    - _check_output

  test_openssh_format_key:
    description: Activate a freshly generated Ed25519 key in OpenSSH format.
    envs:
    - KEYGEN_ARGS: -t ed25519
    after_run:
    - _generate_key
    - _run
    - _check_output

  test_missing_newline_key:
    description: Activate an OpenSSH format key that lost its trailing newline, which some OpenSSH versions reject.
    envs:
    - KEYGEN_ARGS: -t ed25519
    - STRIP_TRAILING_NEWLINE: "true"
    after_run:
    - _generate_key
    - _run
    - _check_output

  _generate_key:
    steps:
    - script:
        title: Generate throwaway SSH key
        inputs:
        - content: |-
            #!/bin/bash
            set -e
            key_dir=$(mktemp -d)
            ssh-keygen -q -N "" -C e2e -f "$key_dir/key" $KEYGEN_ARGS
            if [[ "$STRIP_TRAILING_NEWLINE" == "true" ]]; then
              # Command substitution drops the trailing newline.
              envman add --key SSH_RSA_PRIVATE_KEY --value "$(cat "$key_dir/key")" --no-expand --sensitive
            else
              envman add --key SSH_RSA_PRIVATE_KEY --valuefile "$key_dir/key" --no-expand --sensitive
            fi

  _run:
    steps:
    - change-workdir:
        title: Switch working dir to test/_tmp dir
        description: |-
          To prevent step testing issues, like referencing relative
          files with just './some-file', which would work for local tests
          but not if the step is included in another bitrise.yml!
        inputs:
        - path: ../_tmp
        - is_create_path: true
    - script:
        title: Remove SSH keys from agent
        inputs:
        - content: |-
            #!/bin/bash
            set -x
            ssh-add -D
            envman add --key KEY_PATH --value "./testsave/bitrise_step_activate_ssh_key"
    - path::./:
        inputs:
        - ssh_rsa_private_key: $SSH_RSA_PRIVATE_KEY
        - ssh_key_save_path: $KEY_PATH
        - is_remove_other_identities: "true"
        - verbose: true

  _check_output:
    steps:
    - script:
        title: Output check
        inputs:
        - content: |-
            #!/bin/bash
            set -e

            echo "Loaded identities:"
            ssh-add -l

            if [[ ! -f $KEY_PATH ]]; then
              echo "[!] Private key not found at path: $KEY_PATH"
              exit 1
            fi

            if [ -z "$SSH_AUTH_SOCK" ] ; then
              echo " [!] Missing: SSH_AUTH_SOCK"
              exit 1
            else
              echo "-> SSH_AUTH_SOCK: $SSH_AUTH_SOCK"
            fi
